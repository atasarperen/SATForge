 const DM=["Math","Reading & Writing"],SL=[];DM.forEach((d,di)=>[1,2,3].forEach(lv=>{const pool=Q.filter(q=>q.d===d&&q.lv===lv),k=SL.length;SL.push({k,di,lv,q:pool[(h+k*131)%pool.length],lb:`${d} · ${LN[lv]}`})}));
 a.append($(`<div><h1>Practice a little every day.</h1><p class="meta" style="max-width:58ch">Free, self-guided SAT practice: six daily questions, ${cm(Q.length)} training questions across 12 skills, ${W.length} vocab words, and a timed diagnostic. Progress saves in this browser.</p></div>`));
 const stc=$(`<div></div>`),hd=$(`<h2></h2>`),dc=$(`<div></div>`),skc=$(`<div></div>`),stacks=[];
 const ds=()=>{const n=S.log.length,c=S.log.filter(l=>l.ok).length;stc.innerHTML=`<div class="stats"><div class="card"><b>${n}</b><span>questions answered</span></div><div class="card"><b>${n?Math.round(100*c/n):0}%</b><span>accuracy</span></div><div class="card"><b>${S.streak}</b><span>day streak</span></div></div>`;skc.innerHTML=`<h2>Accuracy by skill</h2><div class="card">${bars(by("s"))}</div>`;

  if(d&&!d.open){const b=$(`<div class="card fade"><p><b class="${d.ok?"gt":"rt"}">${d.ok?"✔ Nailed it.":"✘ Missed."}</b> <span class="meta">${x.lb}</span></p></div>`),t=$(`<button>Show explanation</button>`);

  box.append(qcard(q,(ok,i)=>{S.daily.a[x.k]={i,ok,open:1};S.log.push({id:q.id,ok});const y=new Date(Date.now()-864e5).toLocaleDateString("en-CA");if(S.last!==today()){S.streak=S.last===y?S.streak+1:1;S.last=today()}save();ds();fin()},{brief:1,pre:d?d.i:undefined}));
  if(d)fin()};
 DM.forEach((d,di)=>{const w=$(`<div><h3 class="sh">${d==="Math"?"Math":"English (Reading & Writing)"}</h3><div class="chips"></div><div></div></div>`),bar=w.children[1],box=w.children[2],xs=SL.filter(x=>x.di===di);
  let cur=xs.find(x=>!S.daily.a[x.k]||S.daily.a[x.k].open)||xs[0];
  const upd=()=>{bar.innerHTML="";xs.forEach(x=>{const e=S.daily.a[x.k],b=$(`<button class="${x===cur?"on":""}">${LN[x.lv]}${e?(e.ok?" ✔":" ✘"):""}</button>`);b.onclick=()=>{cur=x;upd();slot(x,box)};bar.append(b)})};
  stacks.push({upd});upd();slot(cur,box);dc.append(w)});

const buildDiag=()=>{const U=new Set(S.dused||[]),ids=[],sb=x=>SUBS.filter(s=>s[1]===x).map(s=>s[0]),rn=()=>Math.random()-.5;
 const take=s=>{let p=DQ.filter(q=>q.s===s&&!U.has(q.id));if(!p.length){DQ.filter(q=>q.s===s).forEach(q=>U.delete(q.id));p=DQ.filter(q=>q.s===s)}const c=p.sort(rn)[0];U.add(c.id);ids.push(c.id)};
 const m=sb("Math"),e=sb("Reading & Writing");m.forEach(take);[...m].sort(rn).slice(0,3).forEach(take);e.forEach(take);e.forEach(take);
 S.dused=[...U];save();return ids.sort(rn)};
R.train=a=>{const T=S.tr;a.append($(`<h1>Training</h1>`));const f=$(`<div class="card"></div>`),box=$(`<div></div>`);a.append(f,box);
 const key=()=>T.dom+"|"+T.sk+"|"+T.lv,idx=()=>T.pos[key()]||0;

 const chips=(lb,vals,k,fmt=x=>x)=>{const w=$(`<div><div class="meta">${lb}</div><div class="chips"></div></div>`);vals.forEach(v=>{const b=$(`<button class="${T[k]===v?"on":""}">${fmt(v)}</button>`);b.onclick=()=>{T[k]=v;if(k==="dom")T.sk="All";save();draw()};w.lastChild.append(b)});return w};
 function draw(){if(!skills().includes(T.sk))T.sk="All";f.innerHTML="";
  f.append(chips("Section",["All","Math","Reading & Writing"],"dom"),chips("Skill",skills(),"sk"),chips("Difficulty",[0,1,2,3],"lv",v=>v?LN[v]:"All"));
  const ls=QS.filter(q=>(T.dom==="All"||q.d===T.dom)&&(T.sk==="All"||q.s===T.sk)&&(!T.lv||q.lv===T.lv));box.innerHTML="";
  if(!ls.length){box.append($(`<div class="card">No questions match. Try another skill or difficulty.</div>`));return}
  const i=Math.min(idx(),ls.length-1),q=ls[i];T.pos[key()]=i;
  box.append($(`<div class="meta">Question ${i+1} of ${ls.length} · ${ls.filter(x=>x.id in S.sess).length} answered</div>`));
  box.append(qcard(q,(ok,j)=>{S.sess[q.id]=j;S.log.push({id:q.id,ok});save()},{pre:S.sess[q.id]}));
  const pv=$(`<button>Previous</button>`),nx=$(`<button class="p">Next question</button>`),rs=$(`<button>Retry this set</button>`);
  pv.onclick=()=>{T.pos[key()]=(i-1+ls.length)%ls.length;save();draw()};nx.onclick=()=>{T.pos[key()]=(i+1)%ls.length;save();draw()};
  rs.onclick=()=>{ls.forEach(x=>delete S.sess[x.id]);T.pos[key()]=0;save();draw()};box.append(pv," ",nx," ",rs)}
 draw()};
R.vocab=a=>{a.append($(`<h1>Vocab</h1>`));const box=$(`<div></div>`);a.append(box);
 let h=0;for(const c of today())h=(h*31+c.charCodeAt(0))%997;
 const daily=[0,1,2,3,4].map(k=>(h+k*7)%W.length);let q=[...daily],free=S.vd&&S.vd.date===today(),cnt=0,last=-1;
 function card(i,top,onK,onR){box.innerHTML="";box.className="";box.append(top);const[w,d]=W[i];
  const fl=$(`<div class="flip" tabindex="0" role="button" aria-label="Flip card"><div class="inner"><div class="face"><div>${w}<small>tap to flip</small></div></div><div class="face b"><div>${d}</div></div></div></div>`);
  fl.onclick=()=>fl.classList.toggle("on");fl.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fl.click()}};
  const k=$(`<button class="p">I know it</button>`),r=$(`<button>Review again</button>`);
  const go=(c,fn)=>{fl.classList.add(c);k.disabled=r.disabled=true;setTimeout(fn,600)};
  k.onclick=()=>go("gok",()=>{if(!S.known.includes(w))S.known.push(w);save();onK()});r.onclick=()=>go("gno",()=>{S.known=S.known.filter(x=>x!==w);save();onR()});box.append(fl,k," ",r)}
 function dly(){if(!q.length){S.vd={date:today()};save();return fin()}
  const n=5-q.length;card(q[0],$(`<div><p class="meta">Daily 5 · ${n} of 5 learned</p><div class="bar"><div style="width:${n*20}%"></div></div></div>`),()=>{q.shift();dly()},()=>{q.push(q.shift());dly()})}
 function fin(){box.innerHTML=`<div class="card fade" style="text-align:center"><div class="check pop">✔</div><h2>Daily 5 complete</h2><p>You learned all five of today’s words. A fresh daily set arrives tomorrow.</p></div>`;
  const b=$(`<button class="p">Keep going with unlimited words</button>`);b.onclick=()=>{free=true;unl()};box.append(b)}
 function unl(){const pool=W.map((x,i)=>i).filter(i=>i!==last&&!S.known.includes(W[i][0]));const p=pool.length?pool:W.map((x,i)=>i).filter(i=>i!==last);
  const i=p[Math.floor(Math.random()*p.length)];last=i;
  card(i,$(`<p class="meta">Unlimited · ${cnt} known this session · ${S.known.length}/${W.length} words mastered overall</p>`),()=>{cnt++;unl()},()=>unl())}

R.diagnostic=a=>{a.append($(`<h1>Diagnostic</h1>`));const box=$(`<div></div>`);a.append(box);

 function intro(){swap();box.append($(`<div class="card"><p>20 mixed questions, 25 minutes. Every diagnostic question is reserved for this test: none of them appear in Training or the daily questions, and retakes use questions you haven’t seen yet. Answers stay hidden until you submit, and you can change them any time. You’ll get accuracy by section and skill, then a full review.</p></div>`));
  const go=$(`<button class="p">Start diagnostic</button>`);go.onclick=()=>{S.dg={ord:buildDiag(),ans:{},end:Date.now()+1500e3};S.dgr=null;save();test()};box.append(go)}
 function test(){swap();const g=S.dg,tm=$(`<div class="timer"></div>`);box.append(tm);
  const upd=()=>{const t=Math.max(0,Math.round((g.end-Date.now())/1000));tm.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")} · ${Object.keys(g.ans).length}/${g.ord.length} answered`;if(t<=0)submit()};

  box.append($(`<h2>Review your answers</h2>`));r.ord.forEach(id=>box.append(qcard(qm(id),()=>{},{pre:r.ans[id]==null?-1:r.ans[id]})));
  const rt=$(`<button class="p">Retake diagnostic</button>`);rt.onclick=()=>{S.dgr=null;save();intro()};box.append(rt)}
 S.dgr?results():S.dg?test():intro()};
